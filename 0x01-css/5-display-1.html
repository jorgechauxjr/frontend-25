<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
        }
        /* Block */
        div {
            background: salmon;
            width: 200px;
            height: 200px;
            margin: 20px;
        }
        /* Inline */
        a {
            
            background-color: skyblue;
            /* el width y height no va a aplicar por ser inline */
            width: 200px;
            height: 200px;
            /* el margin solo apllica a los lados */
            margin: 20px;
        }
        /* Inline and block */
        button {
            background: slateblue;
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <div>Block</div>
    <a href="/">Inline</a>
    <button>Inline and Block</button>
</body>
</html>
