<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            color: salmon;
        }
        p::first-letter {
            color: green;
        }
        p::before {
            content: "👍";
        }
        p::after {
            content: "😁";
        }
        p:hover {
            color: skyblue;
        }
        div p:nth-child(2){
            color: blue;
        }
        ::placeholder {
            color: tomato;
        }
    </style>
</head>
<body>
    <p>Hello</p>
    <div>
        <p>Countries</p>
        <p>Around</p>
        <p>The world</p>
    </div>
    <input type="text" placeholder="Name">
</body>
</html>
